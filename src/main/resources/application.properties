spring.main.banner-mode=off
spring.threads.virtual.enabled=true
spring.lifecycle.timeout-per-shutdown-phase=25s
spring.http.clients.connect-timeout=5s
spring.http.clients.read-timeout=10s
spring.datasource.url=${DB_JDBC_URL}
spring.datasource.hikari.maximum-pool-size=3

server.shutdown=graceful

management.server.port=8081
management.endpoint.prometheus.access=read_only
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoints.web.exposure.include=prometheus,health
management.prometheus.metrics.export.enabled=true

spring.security.oauth2.resourceserver.jwt.issuer-uri=${AZURE_OPENID_CONFIG_ISSUER}
spring.security.oauth2.resourceserver.jwt.audiences=${AZURE_APP_CLIENT_ID}

spring.security.oauth2.client.provider.azuread.token-uri=${AZURE_OPENID_CONFIG_TOKEN_ENDPOINT}

spring.http.serviceclient.pdl-api.base-url=${PDL_URL}
spring.http.serviceclient.digdir-krr-proxy.base-url=${DIGDIR_KRR_PROXY_URL}
spring.http.serviceclient.veilarboppfolging.base-url=${VEILARBOPPFOLGING_URL}
spring.http.serviceclient.veilarbvedtaksstotte.base-url=${VEILARBVEDTAKSSTOTTE_URL}
spring.http.serviceclient.kodeverk-api.base-url=${KODEVERK_URL}
spring.http.serviceclient.nom-api.base-url=${NOM_URL}
spring.http.serviceclient.ao-oppfolgingskontor.base-url=${AO_OPPFOLGINGSKONTOR_URL}

spring.security.oauth2.client.registration.pdl-api.provider=azuread
spring.security.oauth2.client.registration.pdl-api.client-id=${AZURE_APP_CLIENT_ID}
spring.security.oauth2.client.registration.pdl-api.client-secret=${AZURE_APP_CLIENT_SECRET}
spring.security.oauth2.client.registration.pdl-api.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.pdl-api.scope=${PDL_SCOPE}

spring.security.oauth2.client.registration.digdir-krr-proxy.provider=azuread
spring.security.oauth2.client.registration.digdir-krr-proxy.client-id=${AZURE_APP_CLIENT_ID}
spring.security.oauth2.client.registration.digdir-krr-proxy.client-secret=${AZURE_APP_CLIENT_SECRET}
spring.security.oauth2.client.registration.digdir-krr-proxy.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.digdir-krr-proxy.scope=${DIGDIR_KRR_PROXY_SCOPE}

spring.security.oauth2.client.registration.veilarboppfolging.provider=azuread
spring.security.oauth2.client.registration.veilarboppfolging.client-id=${AZURE_APP_CLIENT_ID}
spring.security.oauth2.client.registration.veilarboppfolging.client-secret=${AZURE_APP_CLIENT_SECRET}
spring.security.oauth2.client.registration.veilarboppfolging.authorization-grant-type=client_credentials
