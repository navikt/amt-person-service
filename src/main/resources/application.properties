spring.security.oauth2.client.registration.veilarbvedtaksstotte.provider=azuread
spring.security.oauth2.client.registration.veilarbvedtaksstotte.client-id=${AZURE_APP_CLIENT_ID}
spring.security.oauth2.client.registration.veilarbvedtaksstotte.client-secret=${AZURE_APP_CLIENT_SECRET}
spring.security.oauth2.client.registration.veilarbvedtaksstotte.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.veilarbvedtaksstotte.scope=${VEILARBVEDTAKSSTOTTE_SCOPE}

spring.security.oauth2.client.registration.kodeverk-api.provider=azuread
spring.security.oauth2.client.registration.kodeverk-api.client-id=${AZURE_APP_CLIENT_ID}
spring.security.oauth2.client.registration.kodeverk-api.client-secret=${AZURE_APP_CLIENT_SECRET}
