spring.security.oauth2.client.registration.nom-api.provider=azuread
spring.security.oauth2.client.registration.nom-api.client-id=${AZURE_APP_CLIENT_ID}
spring.security.oauth2.client.registration.nom-api.client-secret=${AZURE_APP_CLIENT_SECRET}
spring.security.oauth2.client.registration.nom-api.authorization-grant-type=client_credentials
