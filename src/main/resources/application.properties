spring.main.banner-mode=off
spring.threads.virtual.enabled=true
spring.lifecycle.timeout-per-shutdown-phase=25s
spring.http.clients.connect-timeout=5s
spring.http.clients.read-timeout=10s
spring.datasource.url=${DB_JDBC_URL}
spring.datasource.hikari.maximum-pool-size=3

server.shutdown=graceful

management.endpoint.prometheus.access=read_only
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoints.web.base-path=/internal
management.endpoints.web.exposure.include=prometheus,health
management.prometheus.metrics.export.enabled=true

nais.env.azureAppClientId=${AZURE_APP_CLIENT_ID}
nais.env.azureAppJWK=${AZURE_APP_JWK}

app.env.sisteOppfolgingsperiodeTopic=${SISTE_OPPFOLGINGSPERIODE_TOPIC}
app.env.sisteTilordnetVeilederTopic=${SISTE_TILORDNET_VEILEDER_TOPIC}
app.env.aktorV2Topic=${AKTOR_V2_TOPIC}
app.env.skjermedePersonerTopic=${SKJERMEDE_PERSONER_STATUS_TOPIC}
app.env.leesahTopic=${LEESAH_TOPIC}
app.env.deltakerV2Topic=${DELTAKER_V2_TOPIC}
app.env.oppfolgingsperiodeTopic=${OPPFOLGINGSPERIODE_TOPIC}
app.env.innsatsgruppeTopic=${INNSATSGRUPPE_TOPIC}
app.env.amtNavBrukerTopic=${AMT_NAV_BRUKER_TOPIC}
app.env.amtNavEnhetTopic=${AMT_NAV_ENHET_TOPIC}
app.env.amtArrangorAnsattPersonaliaTopic=${AMT_ARRANGOR_ANSATT_PERSONALIA_TOPIC}
app.env.amtNavAnsattPersonaliaTopic=${AMT_NAV_ANSATT_PERSONALIA_TOPIC}

kafka.enabled=true
kafka.schema.registry.url=${KAFKA_SCHEMA_REGISTRY}
kafka.schema.registry.username=${KAFKA_SCHEMA_REGISTRY_USER}
kafka.schema.registry.password=${KAFKA_SCHEMA_REGISTRY_PASSWORD}

rest.include-stacktrace=false

no.nav.security.jwt.issuer.azuread.discovery-url=${AZURE_APP_WELL_KNOWN_URL}
no.nav.security.jwt.issuer.azuread.accepted-audience=${AZURE_APP_CLIENT_ID}

# VIKTIG: Her må alle navn stemme overens med første del av URL
# Eksempel: https://pdl-api.dev-fss-pub.nais.io -> pdl-api
no.nav.security.jwt.client.registration.pdl-api.token-endpoint-url=${AZURE_OPENID_CONFIG_TOKEN_ENDPOINT}
no.nav.security.jwt.client.registration.pdl-api.grant-type=client_credentials
no.nav.security.jwt.client.registration.pdl-api.scope=${PDL_SCOPE}
no.nav.security.jwt.client.registration.pdl-api.authentication.client-id=${AZURE_APP_CLIENT_ID}
